<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fa" />
    <title>Home</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='14' r='8' fill='%23ffb347'/%3E%3Crect x='12' y='22' width='8' height='5' rx='2' fill='%23888'/%3E%3C/svg%3E"
    />
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar sticky-top bg-body border-bottom">
      <div class="container-fluid gap-2 flex-nowrap">
        <span class="navbar-brand mb-0 h1 me-auto">Home</span>
        <span class="badge rounded-pill text-bg-secondary" id="status">connecting</span>
        <button class="btn btn-outline-secondary" id="theme" type="button" title="Theme">Theme</button>
        <button class="btn btn-outline-secondary" id="refresh" type="button" title="Refresh">Refresh</button>
      </div>
      <div class="container-fluid pb-2">
        <ul class="nav nav-pills flex-nowrap overflow-auto w-100" id="tabs"></ul>
      </div>
    </nav>

    <main class="container-fluid py-3" id="main"></main>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="panel" aria-labelledby="panel-title">
      <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5 mb-0" id="panel-title">Details</h2>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body" id="panel-body"></div>
    </div>

    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" id="toasts"></div>

    <script src="/vendor/bootstrap.bundle.min.js"></script>
    <script src="/vendor/morphdom-umd.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
