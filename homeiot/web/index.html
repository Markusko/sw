<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <title>Home</title>
    <link rel="stylesheet" href="/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='14' r='8' fill='%23ffb347'/%3E%3Crect x='12' y='22' width='8' height='5' rx='2' fill='%23888'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Home</h1>
          <span class="clock" id="clock"></span>
        </div>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <label class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" stroke-linecap="round" />
          </svg>
          <input id="search" type="search" placeholder="Search devices" autocomplete="off" />
        </label>
        <span class="linkstate" id="linkstate"><i class="dot"></i>connecting</span>
        <button class="iconbtn" id="refresh" title="Refresh now" aria-label="Refresh"></button>
        <button class="iconbtn" id="theme" title="Theme" aria-label="Switch theme"></button>
      </header>
      <main id="main"></main>
    </div>
    <div id="overlay"></div>
    <div id="toast"></div>
    <script src="/app.js"></script>
  </body>
</html>
